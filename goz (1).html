const cap=s=>s.charAt(0).toLocaleUpperCase('tr')+s.slice(1);
const RESP=[],DR=[],DT=[],POST=new Map(),stem=w=>w.slice(0,4);
const toks=s=>[...new Set(norm(s).split(' ').filter(Boolean).map(stem))];
for(const [x,d] of ENT)for(const [q1,q2,a] of INT){
  const k=RESP.push(a.split('{X}').join(cap(x)).split('{d}').join(d))-1;
  for(const q of [q1,q2]){const id=DR.length;DR.push(k);const ts=toks(q.split('{X}').join(x));DT.push(ts);for(const t of ts){let p=POST.get(t);if(!p)POST.set(t,p=[]);p.push(id)}}
}
const NDOC=DR.length,IDF=new Map();for(const [t,p] of POST)IDF.set(t,Math.log(NDOC/p.length));
const DN=DT.map(ts=>Math.sqrt(ts.reduce((s,t)=>s+IDF.get(t)**2,0)));DT.length=0;
const UNK=Math.log(NDOC);
function lookup(text){
  const qt=toks(text);if(!qt.length)return null;
  let qn=0;const acc=new Map();
  for(const t of qt){const i=IDF.get(t);if(i===undefined){qn+=UNK*UNK;continue}qn+=i*i;for(const id of POST.get(t))acc.set(id,(acc.get(id)||0)+i*i)}
  qn=Math.sqrt(qn);let best=-1,bs=0;
  for(const [id,s] of acc){const sc=s/(qn*DN[id]);if(sc>bs){bs=sc;best=id}}
  return bs>=.5?{r:RESP[DR[best]],s:bs,k:DR[best]}:null;
}

  else if(pend&&pend.t==='free'&&!/\?$/.test(r))pend=null;
  hist.push({role:'user',parts:[{text:t}]},{role:'model',parts:[{text:r}]});while(hist.length>12)hist.shift();save();
  speak(r.length>420?r.slice(0,420).replace(/[^.!?]*$/,'')||r.slice(0,420):r);
}
